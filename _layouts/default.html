<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/visualizations.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    {% if page.demo %}<script src="{{ '/assets/js/injection-demo.js' | relative_url }}" defer></script>{% endif %}
    {% if page.llm_demo %}<script src="{{ '/assets/js/llm-demo.js' | relative_url }}" defer></script>{% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>{{ site.title }}</span>
        </a>
        <nav aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">Articles</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
        </nav>
      </div>
    </header>
    <main id="main" class="wrap content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="wrap footer-inner">
        <span>Thoughtful technology, explained simply.</span>
        <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>
      </div>
    </footer>
  </body>
</html>
