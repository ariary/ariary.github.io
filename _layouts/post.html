---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow">{{ page.categories | first | default: 'Notes' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-deck">{{ page.description }}</p>{% endif %}
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time>
      {% if page.reading_time %}<span aria-hidden="true">·</span><span>{{ page.reading_time }} min read</span>{% endif %}
    </div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <div class="post-end"><span aria-hidden="true">✳</span><span>Thanks for reading.</span></div>
</article>
